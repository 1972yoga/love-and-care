<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home | Love and Care</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
<div id="header"></div>
<main class="wrap">
  <section class="hero">
    <div>
      <h1>Love and Care</h1>
      <p>Food, toys and comfort for your dog or cat. Delivered to your door.</p>
    </div>
    <div class="hero-art" aria-hidden="true">🐶 🐱</div>
  </section>

  <div class="tabs">
    <button class="tab on" data-pet="">All pets</button>
    <button class="tab" data-pet="dog">Dogs</button>
    <button class="tab" data-pet="cat">Cats</button>
    <select id="cat" aria-label="Category">
      <option value="">All categories</option>
      <option>Food</option><option>Toys</option><option>Accessories</option><option>Grooming</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
  <p id="empty" class="empty" hidden>No products match your search. Try another word.</p>
</main>
<div id="footer"></div>
<div id="toast" class="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
